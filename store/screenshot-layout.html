<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Auto Theater — store screenshot composition</title>
  <style>
    *{box-sizing:border-box} body{margin:0;background:#17191d;color:#f5f5f4;font-family:"Segoe UI",system-ui,sans-serif;width:1280px;height:800px}
    main{position:relative;width:1280px;height:800px;padding:70px 80px}
    header{display:flex;align-items:center;gap:14px;font-size:22px;font-weight:600} header img{width:48px;height:48px}
    .copy{position:absolute;left:90px;top:255px;width:630px}
    h1{font-size:64px;line-height:1.08;letter-spacing:-.035em;margin:0 0 28px;font-weight:650}
    p{max-width:500px;margin:0;color:#b2b7c0;font-size:23px;line-height:1.5}
    .popup{position:absolute;left:825px;top:190px;width:336px;height:395px;box-shadow:0 18px 60px #0005;border-radius:10px}
    footer{position:absolute;left:90px;bottom:70px;color:#b2b7c0;font-size:16px}
    .line{height:3px;width:64px;background:#f04452;margin-bottom:24px}
    .off{display:none}body:has(#paused:target) .on{display:none}body:has(#paused:target) .off{display:block}
  </style>
</head>
<body><main>
  <span id="paused"></span>
  <header><img src="../extension/icons/mark.svg" alt=""><span>Auto Theater for YouTube</span></header>
  <section class="copy on"><div class="line"></div><h1>Your next video.<br>A wider view.</h1><p>Automatically open YouTube videos<br>in theater mode.</p></section>
  <section class="copy off"><div class="line"></div><h1>One switch.<br>You're in control.</h1><p>Pause automatic switching.<br>Keep the view you already chose.</p></section>
  <img class="popup on" src="popup-enabled.png" alt="Actual popup with automatic theater mode enabled">
  <img class="popup off" src="popup-paused.png" alt="Actual popup with automatic theater mode paused">
  <footer>One local preference. No tracking. &nbsp;·&nbsp; Independent extension for desktop YouTube.</footer>
</main></body>
</html>
